name: CopyRepo

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Name of the repository to create'
        required: true
        default: 'my-new-repo'
      description:
        description: 'Description for the repository'
        required: false

jobs:
  Copy-Repo-10-1-1-2:

    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Source
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure Git
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # 3. Push to Destination
      - name: Push to Destination
        env:
          DEST_TOKEN: ${{ secrets.PAT_TOKEN1 }}
        run: |
          # UPDATE THIS URL
          DEST_URL="https://${DEST_TOKEN}@github.com/dxmohan/project1.git"
          # https://${token}@github.com/dxmohan/project1.git
          
          echo "Pushing branch ${{ github.ref_name }}..."
          
          # Push ONLY the current branch (not a full mirror)
          # git push "$DEST_URL" HEAD:${{ github.ref_name }}
          git push https://${{ secrets.PAT_TOKEN1 }}@github.com/dxmohan/project1.git  releases/C101013
   
       
