name: M2UFileCopy-NTT

on:
  workflow_dispatch:

jobs:
  Cleanup-Workspce:
    runs-on: ubuntu2
    steps:
    - name: Cleanup work space directory
      run: |
       echo "Branch: $GITHUB_REF_NAME"
       rm -rf $GITHUB_WORKSPACE
       mkdir -p $GITHUB_WORKSPACE
       ls -ld $GITHUB_WORKSPACE  

  Download-Repo:
    needs: Cleanup-Workspce
    runs-on: ubuntu2
    steps:
    - name: Checkout destination repository
      uses: actions/checkout@v3

    - name: Check downloaded repo.
      run: |
       echo "Branch: $GITHUB_REF_NAME"
       echo " WORKSPACE = $GITHUB_WORKSPACE"
       ls -lrtR $GITHUB_WORKSPACE

  Copy-Repo:
    needs: Download-Repo
    runs-on: ubuntu2
    steps:
    - name: Copy files to remote server
      run: |
        echo "Branch: $GITHUB_REF_NAME"
        ssh mohan@10.1.1.3 "sudo /home/mohan/script1 4"
        scp -rp $GITHUB_WORKSPACE/bv_data mohan@10.1.1.3:/home/mohan/
        scp -p $GITHUB_WORKSPACE/check1 mohan@10.1.1.3:/home/mohan/
        ssh mohan@10.1.1.3 "sudo /home/mohan/script1 1"
        ssh mohan@10.1.1.3 "sudo /home/mohan/script1 2"
        ssh mohan@10.1.1.3 "sudo /home/mohan/script1 3"

  Copy-Repo-10-1-1-3:
    needs: Download-Repo
    runs-on: ubuntu2
    steps:
    - name: Copy files to remote server 10.1.1.3
      run: |
        echo "Branch: $GITHUB_REF_NAME"

        # Add the upstream repository as a remote
        git remote add upstream https://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@github.com/dxmohan/project1.git
          
          # Fetch all branches and tags from upstream
          git fetch upstream
          
          # Checkout the branch you want to sync (e.g., main or master)
          git checkout releases/C202020
          
          # Merge the upstream changes into your branch
          # --ff-only ensures a fast-forward merge for linear history
          git merge upstream/main --ff-only
          
          # Push the updated branch back to your fork
          # The default GITHUB_TOKEN has permission to push to the repo
          git push origin releases/C202020
